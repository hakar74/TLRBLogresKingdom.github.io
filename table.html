<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Скрижали Лута — Logres Kingdom</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        /* Специфичные стили для таблицы */
        .tabs { display: flex; justify-content: center; gap: 15px; margin-bottom: 30px; flex-wrap: wrap; }
        .tab-btn {
            background: rgba(20, 18, 30, 0.8);
            border: 1px solid var(--gold);
            color: var(--gold);
            padding: 12px 25px;
            font-family: 'Cinzel', serif;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        .tab-btn:hover, .tab-btn.active {
            background: var(--gold);
            color: #000;
            box-shadow: 0 0 20px var(--gold-glow);
        }
        .table-container {
            max-height: 60vh;
            overflow-y: auto;
            border: 1px solid rgba(212, 175, 55, 0.3);
            background: rgba(10, 10, 15, 0.8);
            position: relative;
        }
        table { width: 100%; border-collapse: collapse; min-width: 800px; }
        th, td { padding: 15px; text-align: center; border-bottom: 1px solid rgba(212, 175, 55, 0.1); }
        th { 
            background: rgba(212, 175, 55, 0.1); 
            color: var(--gold); 
            position: sticky; 
            top: 0; 
            z-index: 10;
            backdrop-filter: blur(5px);
        }
        td:first-child {
            position: sticky;
            left: 0;
            background: rgba(10, 10, 15, 0.95);
            color: var(--gold);
            font-weight: bold;
            z-index: 5;
            text-align: left;
            padding-left: 20px;
            border-right: 1px solid rgba(212, 175, 55, 0.3);
        }
        th:first-child { z-index: 15; left: 0; }
        
        input.bid-input {
            background: transparent;
            border: 1px solid var(--gold);
            color: #fff;
            width: 80px;
            text-align: center;
            font-family: 'Cinzel', serif;
            padding: 5px;
        }
        input.bid-input:focus { outline: none; box-shadow: 0 0 10px var(--gold); }
        input.bid-input:disabled { border-color: #555; color: #555; cursor: not-allowed; }
        
        .frozen-mark { color: #00ffff; text-shadow: 0 0 10px #00ffff; }
        
        /* Модальное окно */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); z-index: 1000;
            display: flex; justify-content: center; align-items: center;
        }
        .modal-box {
            background: #1a1a2e; border: 2px solid var(--gold);
            padding: 40px; text-align: center; max-width: 500px;
            box-shadow: 0 0 50px rgba(212, 175, 55, 0.3);
        }
        .modal-box h2 { color: var(--gold); margin-bottom: 20px; }
        .modal-input {
            width: 100%; padding: 15px; margin-bottom: 20px;
            background: #0a0a0f; border: 1px solid var(--gold);
            color: #fff; font-family: 'Cinzel', serif; font-size: 1.2rem;
        }
        .hidden { display: none; }
        .error-msg { color: #ff4444; margin-top: 10px; font-size: 0.9rem; }
    </style>
</head>
<body>
    <canvas id="starfield"></canvas>
    
    <!-- МОДАЛКА ВХОДА -->
    <div id="loginModal" class="modal-overlay">
        <div class="modal-box">
            <h2>🗝️ Назови своё имя, путник</h2>
            <p style="margin-bottom: 20px; color: #aaa;">Введи свой игровой ник, дабы узреть свою судьбу</p>
            <input type="text" id="nickInput" class="modal-input" placeholder="Ваш никнейм">
            <button class="cta-button" onclick="attemptLogin()">Войти в зал славы</button>
            <div id="loginError" class="error-msg"></div>
        </div>
    </div>

    <div class="content">
        <div class="main-title">
            <h1>⚔️ Скрижали Лута</h1>
            <div class="sub">«Только достойный получит награду»</div>
        </div>

        <div class="tabs" id="bossTabs">
            <!-- Табы генерируются JS -->
        </div>

        <div class="table-container">
            <table id="lootTable">
                <thead>
                    <tr id="tableHeader">
                        <th>Воин</th>
                        <!-- Предметы -->
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <!-- Строки -->
                </tbody>
            </table>
        </div>

        <div class="cta-wrapper" style="margin-top: 40px;">
            <button class="cta-button" onclick="saveBids()">Вписать в Книгу Судеб</button>
        </div>
        
        <div style="text-align: center; margin-top: 20px;">
            <a href="index.html" style="color: #8f8060; text-decoration: none; font-size: 0.9rem;">← Вернуться к Манифесту</a>
        </div>
    </div>

    <script src="script.js"></script>
    <script>
        // --- Инициализация звездного фона (дублируем логику из style.css если нужно, или подключаем общий скрипт) ---
        // Для краткости предполагаем, что starfield.js подключен или логика внутри script.js, 
        // но так как у нас один script.js для логики данных, добавим простую анимацию сюда или в style.css
        // В данном случае, скопируем минимальную логику канваса сюда для автономности страницы, 
        // либо лучше вынести в отдельный файл ui.js. 
        // Чтобы не усложнять, добавим функцию инициализации канваса прямо здесь, если её нет в глобальной области.
        
        const canvas = document.getElementById('starfield');
        const ctx = canvas.getContext('2d');
        let stars = [];
        
        function initStars() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            stars = [];
            for(let i=0; i<200; i++) {
                stars.push({
                    x: Math.random()*canvas.width,
                    y: Math.random()*canvas.height,
                    r: Math.random()*1.5,
                    a: Math.random(),
                    speed: Math.random()*0.05
                });
            }
        }
        function animateStars() {
            ctx.clearRect(0,0,canvas.width,canvas.height);
            ctx.fillStyle = '#fff';
            stars.forEach(s => {
                ctx.beginPath();
                ctx.arc(s.x, s.y, s.r, 0, Math.PI*2);
                ctx.globalAlpha = s.a;
                ctx.fill();
                s.y -= s.speed;
                if(s.y < 0) s.y = canvas.height;
            });
            requestAnimationFrame(animateStars);
        }
        window.addEventListener('resize', initStars);
        initStars();
        animateStars();

        // --- ЛОГИКА ПРИЛОЖЕНИЯ ---

        let currentBossKey = null;

        async function loadData() {
            try {
                appData = await LogresApp.getData();
                renderTabs();
                // Если есть табы, выбираем первый
                if (appData.bosses && Object.keys(appData.bosses).length > 0) {
                    const firstKey = Object.keys(appData.bosses)[0];
                    selectTab(firstKey);
                }
            } catch (e) {
                document.getElementById('loginError').innerText = "Ошибка связи с хранилищем душ. Проверьте консоль.";
                console.error(e);
            }
        }

        function renderTabs() {
            const container = document.getElementById('bossTabs');
            container.innerHTML = '';
            for (const [key, boss] of Object.entries(appData.bosses)) {
                const btn = document.createElement('button');
                btn.className = 'tab-btn';
                btn.innerText = boss.name;
                btn.onclick = () => selectTab(key);
                container.appendChild(btn);
            }
        }

        function selectTab(key) {
            currentBossKey = key;
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active'); // Внимание: event может быть undefined при программном вызове
            // Исправление для программного вызова:
            const buttons = document.querySelectorAll('.tab-btn');
            buttons.forEach((b, index) => {
                if(Object.keys(appData.bosses)[index] === key) b.classList.add('active');
            });
            
            renderTable(key);
        }

        function renderTable(bossKey) {
            const boss = appData.bosses[bossKey];
            const thead = document.getElementById('tableHeader');
            const tbody = document.getElementById('tableBody');
            
            // Заголовок
            let headerHTML = '<th>Воин</th>';
            boss.items.forEach(item => {
                headerHTML += `<th>${item}</th>`;
            });
            thead.innerHTML = headerHTML;

            // Тело
            tbody.innerHTML = '';
            const sortedMembers = [...appData.members].sort((a, b) => a.localeCompare(b));

            sortedMembers.forEach(member => {
                const tr = document.createElement('tr');
                const isMe = member.toLowerCase() === LogresApp.currentUser.toLowerCase();
                const frozen = LogresApp.isFrozen(member);
                
                let rowHTML = `<td>${frozen ? '❄ ' : ''}${member}</td>`;
                
                boss.items.forEach(item => {
                    const bidValue = appData.bids[bossKey]?.[item]?.[member] || 0;
                    if (isMe && !frozen) {
                        rowHTML += `<td><input type="number" min="0" max="999999" class="bid-input" 
                            data-item="${item}" data-member="${member}" value="${bidValue}"></td>`;
                    } else {
                        const style = frozen ? 'color:#555' : (bidValue > 0 ? 'color:#fff' : 'color:#444');
                        rowHTML += `<td style="${style}">${bidValue > 0 ? bidValue : '-'}</td>`;
                    }
                });
                
                tr.innerHTML = rowHTML;
                tbody.appendChild(tr);
            });
        }

        async function attemptLogin() {
            const nick = document.getElementById('nickInput').value.trim();
            const errorMsg = document.getElementById('loginError');
            
            if (!nick) {
                errorMsg.innerText = "Имя не может быть пустым!";
                return;
            }

            // Ждем загрузки данных, если еще не загружены
            if (!appData) await loadData();

            const found = appData.members.some(m => m.toLowerCase() === nick.toLowerCase());
            
            if (found) {
                LogresApp.currentUser = nick;
                document.getElementById('loginModal').classList.add('hidden');
                loadData().then(() => {
                     if (Object.keys(appData.bosses).length > 0) selectTab(Object.keys(appData.bosses)[0]);
                });
            } else {
                errorMsg.innerText = "Твой дух не отмечен печатью Logres. Обратись к архимагу (админу).";
            }
        }

        async function saveBids() {
            const inputs = document.querySelectorAll('.bid-input');
            let hasChanges = false;

            inputs.forEach(input => {
                const item = input.dataset.item;
                const member = input.dataset.member;
                const val = parseInt(input.value) || 0;

                if (!appData.bids[currentBossKey]) appData.bids[currentBossKey] = {};
                if (!appData.bids[currentBossKey][item]) appData.bids[currentBossKey][item] = {};
                
                if (val > 0) {
                    appData.bids[currentBossKey][item][member] = val;
                } else {
                    delete appData.bids[currentBossKey][item][member];
                }
                hasChanges = true;
            });

            if (hasChanges) {
                await LogresApp.saveData(appData);
                alert('Твои заявки вознесены к звёздам!');
                renderTable(currentBossKey);
            } else {
                alert('Нет изменений для сохранения.');
            }
        }

        // Старт
        window.addEventListener('DOMContentLoaded', () => {
             // Данные загрузятся при попытке логина
        });
    </script>
</body>
</html>
